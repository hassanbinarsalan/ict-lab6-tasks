<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .form-box {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 95%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
        }

        .rating {
            margin-top: 10px;
        }

        .rating input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h2>Feedback Form</h2>

        <form>

            <label>Name:</label>
            <input type="text" placeholder="Enter your name">

            <label>Email:</label>
            <input type="email" placeholder="Enter your email">

            <label>Feedback:</label>
            <textarea placeholder="Enter your feedback"></textarea>

            <label>Rate Our Service:</label>

            <div class="rating">
                <input type="radio" name="rating" value="1"> 1 Star
                <input type="radio" name="rating" value="2"> 2 Stars
                <input type="radio" name="rating" value="3"> 3 Stars
                <input type="radio" name="rating" value="4"> 4 Stars
                <input type="radio" name="rating" value="5"> 5 Stars
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
