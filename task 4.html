<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .login-box {
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 97%;
            padding: 10px;
            margin-top: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        a {
            display: block;
            margin-top: 15px;
            color: blue;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Username">

            <input type="password" placeholder="Password">

            <button type="submit">Submit</button>

            <a href="#">Forgot Password?</a>
        </form>
    </div>
</body>
</html>
