<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        .card {
            width: 300px;
            border: 2px solid #ddd;
            padding: 15px;
            margin: 30px auto;
            text-align: center;
            border-radius: 10px;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h2 {
            margin: 10px 0;
        }

        .card p {
            color: #555;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: green;
        }

        .card button {
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        .card:hover {
            box-shadow: 0 0 15px gray;
            transform: scale(1.03);
        }

        .card button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="images.jpg" alt="Headphones">

        <h2>Wireless Headphones</h2>

        <p>
            High-quality wireless headphones with clear sound
            and comfortable design.
        </p>

        <p class="price">$49.99</p>

        <button>Buy Now</button>

    </div>
</body>
</html>
